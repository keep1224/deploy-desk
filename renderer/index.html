<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Deploy Desk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">Deploy Desk</div>
      <div class="bar-group">
        <label for="profileSelect">连接</label>
        <select id="profileSelect"></select>
        <button id="btnTest" class="btn">测试连接</button>
        <button id="btnProbe" class="btn">采集状态</button>
        <span id="connDot" class="dot" title="未连接"></span>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>服务器状态</h2>
        <dl id="status" class="kv">
          <dt>Node</dt><dd id="st-node">—</dd>
          <dt>pnpm</dt><dd id="st-pnpm">—</dd>
          <dt>Nginx</dt><dd id="st-nginx">—</dd>
          <dt>MySQL</dt><dd id="st-mysql">—</dd>
          <dt>内存 / Swap</dt><dd id="st-mem">—</dd>
          <dt>服务</dt><dd id="st-svc">—</dd>
          <dt>监听端口</dt><dd id="st-ports">—</dd>
          <dt>项目目录</dt><dd id="st-apps">—</dd>
          <dt>bare 仓库</dt><dd id="st-repos">—</dd>
        </dl>
      </section>

      <section class="card">
        <h2>连接配置</h2>
        <form id="profileForm" class="form">
          <label>名称<input name="name" placeholder="生产服务器" /></label>
          <div class="row">
            <label>主机<input name="host" placeholder="185.242.234.143" required /></label>
            <label class="narrow">端口<input name="port" value="22" /></label>
          </div>
          <label>用户<input name="username" placeholder="root" /></label>
          <div class="row">
            <label>认证
              <select name="auth">
                <option value="key">私钥</option>
                <option value="password">密码</option>
              </select>
            </label>
          </div>
          <div data-auth="key">
            <label>私钥路径<input name="keyPath" placeholder="C:\Users\you\.ssh\id_rsa" /></label>
            <label>私钥密码（可选）<input name="passphrase" type="password" placeholder="留空表示不修改" /></label>
          </div>
          <div data-auth="password" hidden>
            <label>密码<input name="password" type="password" placeholder="留空表示不修改" /></label>
          </div>
          <div class="row actions">
            <button type="submit" class="btn primary">保存</button>
            <button type="button" id="btnDeleteProfile" class="btn danger">删除</button>
            <button type="button" id="btnNewProfile" class="btn">新建</button>
          </div>
          <p id="secretHint" class="hint"></p>
        </form>
      </section>

      <section class="card span2">
        <h2>项目配置 <code>projects.conf</code></h2>
        <div class="row">
          <label class="grow">本地脚本目录（scripts/deploy）
            <input id="scriptsDir" placeholder="D:\Users\Desktop\my-rspack-app\scripts\deploy" />
          </label>
          <button id="btnPickScripts" class="btn narrow-btn">选择</button>
        </div>
        <textarea id="confText" spellcheck="false" rows="12" placeholder="app-a-web   web   -      app-a.example.com   app-a-api
app-a-api   api   3001   -                   -"></textarea>
        <div class="row actions">
          <button id="btnApplyConf" class="btn primary">上传并应用</button>
          <button id="btnDownloadConf" class="btn">从服务器下载</button>
          <span class="hint">应用会执行 /opt/deploy/apply.sh，幂等</span>
        </div>
      </section>

      <section class="card">
        <h2>发布后端</h2>
        <label>仓库目录
          <div class="row">
            <input id="repoDir" class="grow" placeholder="D:\code\my-api" />
            <button id="btnPickRepo" class="btn narrow-btn">选择</button>
          </div>
        </label>
        <div class="row">
          <label class="grow">远端<input id="gitRemote" value="deploy" /></label>
          <label class="grow">分支<input id="gitBranch" value="master" /></label>
        </div>
        <div class="row actions">
          <button id="btnPush" class="btn primary">git push 发布</button>
        </div>
        <p class="hint">本地推送后，服务器钩子会自动 install → build → restart</p>
      </section>

      <section class="card">
        <h2>发布前端</h2>
        <label>dist 目录
          <div class="row">
            <input id="distDir" class="grow" placeholder="D:\code\my-web\dist" />
            <button id="btnPickDist" class="btn narrow-btn">选择</button>
          </div>
        </label>
        <label>服务器目标目录<input id="webTarget" value="/var/www/app-a-web" /></label>
        <label class="check"><input id="webClean" type="checkbox" checked /> 上传前清空目标目录</label>
        <div class="row actions">
          <button id="btnUpload" class="btn primary">上传</button>
        </div>
      </section>
    </main>

    <footer class="console-wrap">
      <div class="console-head">
        <span>日志</span>
        <button id="btnClear" class="btn tiny">清空</button>
      </div>
      <pre id="console" class="console"></pre>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
